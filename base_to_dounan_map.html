<title>加工厂→门店 运输配送地图</title>

<style>
:root {
  --bg: #FDF9F5; --c1: #FDF9F5; --c2: #F8F0E3; --c3: #E8DDD0;
  --c4: #E8D5B5; --c5: #D4B896; --c6: #C4A27A; --c7: #A8825A;
  --c8: #7A5C3E; --c9: #B5A69A; --text: #4a3a2c; --border: #E8DDD0;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"SimSun","宋体",serif; background:var(--bg); overflow:hidden; }
#map { width:100vw; height:100vh; background:var(--bg); }
.leaflet-container { background:var(--bg)!important; }

.map-title p { font-size:12px; color:var(--c9); margin-top:2px; text-shadow:0 1px 4px rgba(255,255,255,0.9); }
.dounan-marker {
  position:relative; width:40px; height:40px; display:flex;
  align-items:center; justify-content:center; font-size:28px; line-height:1;
  color:#5A3E28; text-shadow:0 0 8px rgba(90,62,40,0.3),0 1px 2px rgba(0,0,0,0.1);
  cursor:pointer;
}
.dounan-marker .pulse {
  position:absolute; width:100%; height:100%; border-radius:50%;
  background:rgba(168,130,90,0.25);
  animation:pulse-ring 2s ease-out infinite; pointer-events:none;
}
@keyframes pulse-ring { 0%{transform:scale(0.5);opacity:1} 100%{transform:scale(2.5);opacity:0} }
.dounan-label {
  position:absolute; bottom:-18px; left:50%; transform:translateX(-50%);
  white-space:nowrap; font-size:11px; font-weight:600; color:var(--c7); text-shadow:0 0 4px #fff;
}
.legend {
  background:rgba(255,255,255,0.90); border-radius:10px; padding:12px 14px;
  min-width:150px; box-shadow:0 2px 12px rgba(0,0,0,0.08);
  border:1px solid var(--border); backdrop-filter:blur(6px);
}
.legend h3 { font-size:12px; font-weight:600; color:var(--c8); margin-bottom:6px; }
.legend-bar { display:flex; height:14px; border-radius:4px; overflow:hidden; margin:6px 0 4px; gap:2px; }
.legend-step { flex:1; border-radius:2px; }
.legend-labels { display:flex; justify-content:space-between; font-size:10px; color:var(--c9); margin-top:2px; }
.legend-row { display:flex; align-items:center; gap:8px; font-size:11px; color:var(--c8); padding:2px 0; }
.legend-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.legend-line { width:20px; height:3px; border-radius:2px; flex-shrink:0; }
</style>
</head>

// 2. 辅助函数

function flowColor(flow, maxFlow) {
  var v = Math.log(flow + 1) / Math.log(maxFlow + 1);
  v = Math.max(0, Math.min(1, v));
  // 5 级分级色彩（从低到高）
  var steps = [
    { max: 0.15, color: '#F5E6D0' },
    { max: 0.35, color: '#DFC8A0' },
    { max: 0.55, color: '#C4A27A' },
    { max: 0.75, color: '#9B7A52' },
    { max: 1.01, color: '#5A3E28' }
  ];
  for (var i = 0; i < steps.length; i++) {
    if (v <= steps[i].max) return steps[i].color;
  }
  return '#7A5C3E';
}
function arcPoints(lng1, lat1, lng2, lat2, curve) {
  curve = curve || 0.2;
  var pts = [];
  var midLng = (lng1 + lng2) / 2, midLat = (lat1 + lat2) / 2;
  var dx = lng2 - lng1, dy = lat2 - lat1;
  var dist = Math.sqrt(dx * dx + dy * dy) || 0.001;
  var cx = midLng - dy / dist * curve * dist;
  var cy = midLat + dx / dist * curve * dist;
  for (var t = 0; t <= 1; t += 0.025) {
    var x = (1-t)*(1-t)*lng1 + 2*(1-t)*t*cx + t*t*lng2;
    var y = (1-t)*(1-t)*lat1 + 2*(1-t)*t*cy + t*t*lat2;
    pts.push([x, y]);  // [lng, lat] for GeoJSON
  }
  return pts;
}

var MAX_TRAVEL = OD_PAIRS.reduce(function(m, p) { return Math.max(m, p[2]); }, 0);

// 加工厂索引
var factoryMap = {};
FACTORIES.forEach(function(f) { factoryMap[f[0]] = { lat: f[1], lon: f[2] }; });
// 门店索引
var storeMap = {};
STORES.forEach(function(s) { storeMap[s[0]] = { lat: s[1], lon: s[2] }; });

// 加工厂 GeoJSON
var factoryGeoJSON = {
  type: 'FeatureCollection',
  features: FACTORIES.map(function(f) {
    return { type: 'Feature',
      properties: { name: FACTORY_NAMES[f[0]] || '加工厂 ' + f[0], id: f[0] },
      geometry: { type: 'Point', coordinates: [f[2], f[1]] } };
  })
};

// 门店 GeoJSON
var storeGeoJSON = {
  type: 'FeatureCollection',
  features: STORES.map(function(s) {
    return { type: 'Feature',
      properties: { name: STORE_NAMES[s[0]] || '门店 ' + s[0], id: s[0] },
      geometry: { type: 'Point', coordinates: [s[2], s[1]] } };
  })
};

var map = L.map('map', { center: [24.8, 101.8], zoom: 6.5, zoomSnap: 0.5, zoomControl: true, attributionControl: false });
L.tileLayer('https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', { attribution: '© 高德地图', maxZoom: 18, opacity: 0.8, subdomains: ['webrd01','webrd02','webrd03','webrd04'] }).addTo(map);
legendControl.addTo(map);
// Compute bounds from all data points
var allCoords = [];
FACTORIES.forEach(function(f) { allCoords.push([f[1], f[2]]); });
STORES.forEach(function(s) { allCoords.push([s[1], s[2]]); });
if (EMBED_POI_FACTORIES && EMBED_POI_FACTORIES.features) {
  EMBED_POI_FACTORIES.features.forEach(function(feat) {
    if (feat.geometry && feat.geometry.coordinates)
      allCoords.push([feat.geometry.coordinates[1], feat.geometry.coordinates[0]]);
  });
}
if (EMBED_POI_STORES && EMBED_POI_STORES.features) {
  EMBED_POI_STORES.features.forEach(function(feat) {
    if (feat.geometry && feat.geometry.coordinates)
      allCoords.push([feat.geometry.coordinates[1], feat.geometry.coordinates[0]]);
  });
}
var bounds = L.latLngBounds(allCoords);
map.fitBounds(bounds.pad(0.08), { maxZoom: 5.5 });
map.setMaxBounds(bounds.pad(0.5));

// 加工厂节点
var factoryNodeLayer = L.geoJSON(factoryGeoJSON, {
  pointToLayer: function(feat, latlng) {
    var connCount = 0;
    OD_PAIRS.forEach(function(p) { if (p[0] === feat.properties.id) connCount++; });
    var r = Math.max(3, Math.min(10, 2 + Math.log(connCount + 1) * 1.2));
    return L.circleMarker(latlng, {
      radius: r, fillColor: '#7A4A28',
      fillOpacity: 0.85, color: '#fff', weight: 0.8, opacity: 0.6
    });
  },
  onEachFeature: function(feat, layer) {
    var connCount = 0;
    OD_PAIRS.forEach(function(p) { if (p[0] === feat.properties.id) connCount++; });
    layer.bindTooltip('<strong>' + feat.properties.name + '</strong><br/>'
      + '<span style="color:#888;">连接门店数：</span>' + connCount,
      { sticky: true });
  }
});
factoryNodeLayer.addTo(map);

// 门店节点
var storeNodeLayer = L.geoJSON(storeGeoJSON, {
  pointToLayer: function(feat, latlng) {
    return L.circleMarker(latlng, {
      radius: 4, fillColor: '#D4A86A',
      fillOpacity: 0.8, color: '#fff', weight: 0.6, opacity: 0.5
    });
  },
  onEachFeature: function(feat, layer) {
    var connCount = 0;

    layer.bindTooltip('<strong>' + feat.properties.name + '</strong><br/>'
      + '<span style="color:#888;">来源加工厂数：</span>' + connCount,
      { sticky: true });
  }
});
storeNodeLayer.addTo(map);

// Auxiliary POI layer — factory POI (green dots), exclude nodes already in FACTORIES
var poiFactoryCoords = {};

var poiFactoryLayer = L.geoJSON(EMBED_POI_FACTORIES, {
  filter: function(feat) {
    if (!feat.geometry || !feat.geometry.coordinates) return false;
    var key = feat.geometry.coordinates[1].toFixed(4) + ',' + feat.geometry.coordinates[0].toFixed(4);
    return !poiFactoryCoords[key];
  },
  pointToLayer: function(feat, latlng) {
    return L.circleMarker(latlng, {
      radius: 3, fillColor: '#5FA85F',
      fillOpacity: 0.5, color: '#558B55', weight: 0.5, opacity: 0.3
    });
  },
  onEachFeature: function(feat, layer) {
    var p = feat.properties || {};

// 加工厂距离聚类 + 最小外包圆（虚线）
var CLUSTER_KM = 30;
(function() {
  var pts = FACTORIES.map(function(f, i) { return { idx: i, ll: L.latLng(f[1], f[2]) }; });
  var ass = {}, cls = [];
  pts.forEach(function(f) {
    if (ass[f.idx]) return;
    var g = [f.idx], q = [f.idx];
    ass[f.idx] = true;
    while (q.length) {
      var c = q.shift();
      pts.forEach(function(p) {
        if (ass[p.idx]) return;
        if (pts[c].ll.distanceTo(p.ll) <= CLUSTER_KM * 1000) {
          ass[p.idx] = true; g.push(p.idx); q.push(p.idx);
        }
      });
    }
    cls.push(g);
  });
  cls.forEach(function(cl) {
    var p = cl.map(function(i) { return pts[i].ll; });
    var cx = p.reduce(function(s, x) { return s + x.lat; }, 0) / p.length;
    var cy = p.reduce(function(s, x) { return s + x.lng; }, 0) / p.length;
    var ct = L.latLng(cx, cy);
    var mr = 0;
    p.forEach(function(x) { var d = ct.distanceTo(x); if (d > mr) mr = d; });
    L.circle(ct, { radius: mr * 1.30, color: '#8A6A3E', fillColor: 'transparent', weight: 4, opacity: 0.6, dashArray: '8,10' }).addTo(map);

  });
})();

// 鲜花饼门店距离聚类 + 最小外包圆（虚线）
(function() {
  var storePts = [];
  if (typeof EMBED_POI_STORES !== 'undefined' && EMBED_POI_STORES.features) {
    EMBED_POI_STORES.features.forEach(function(f, i) {
      if (f.geometry && f.geometry.coordinates)
        storePts.push({ idx: i, ll: L.latLng(f.geometry.coordinates[1], f.geometry.coordinates[0]) });
    });
  }
  var ass = {}, cls = [];
  storePts.forEach(function(f) {
    if (ass[f.idx]) return;
    var g = [f.idx], q = [f.idx];
    ass[f.idx] = true;
    while (q.length) {
      var c = q.shift();
      storePts.forEach(function(p) {
        if (ass[p.idx]) return;
        if (storePts[c].ll.distanceTo(p.ll) <= CLUSTER_KM * 1000) {
          ass[p.idx] = true; g.push(p.idx); q.push(p.idx);
        }
      });
    }
    cls.push(g);
  });
  cls.forEach(function(cl) {
    var p = cl.map(function(i) { return storePts[i].ll; });
    var cx = p.reduce(function(s, x) { return s + x.lat; }, 0) / p.length;
    var cy = p.reduce(function(s, x) { return s + x.lng; }, 0) / p.length;
    var ct = L.latLng(cx, cy);
    var mr = 0;
    p.forEach(function(x) { var d = ct.distanceTo(x); if (d > mr) mr = d; });
    L.circle(ct, { radius: mr * 1.30, color: '#E8A0A0', fillColor: 'transparent', weight: 4, opacity: 0.6, dashArray: '8,10' }).addTo(map);

  });
})();






// 加工厂聚集区域标注
var cityCenters = {};
FACTORIES.forEach(function(f) {
  var lat = f[1], lon = f[2];
  var cityKey = '加工厂集群';
  if (!cityCenters[cityKey]) cityCenters[cityKey] = { lats: [], lngs: [] };
  cityCenters[cityKey].lats.push(lat);
  cityCenters[cityKey].lngs.push(lon);
});
var labelLayer = L.layerGroup();
var labelMarkers = [];
Object.keys(cityCenters).forEach(function(city) {
  var d = cityCenters[city];
  var lat = d.lats.reduce(function(a, b) { return a + b; }, 0) / d.lats.length;
  var lng = d.lngs.reduce(function(a, b) { return a + b; }, 0) / d.lngs.length;
  var icon = L.divIcon({
    className: '',
    html: '<div style="font-size:12px;font-weight:500;color:#B5A69A;text-shadow:0 0 6px #fff,0 0 4px #fff;white-space:nowrap;pointer-events:none;">' + city + '</div>',
    iconSize: [0, 0], iconAnchor: [0, 0]
  });
  var m = L.marker([lat + 0.08, lng], { icon: icon, interactive: false });
  labelMarkers.push({ marker: m, city: city });
  labelLayer.addLayer(m);
});
labelLayer.addTo(map);
map.on('zoom', function() {
  var z = map.getZoom();
  var s = Math.max(8, Math.min(16, z * 1.4));
  labelMarkers.forEach(function(item) { item.marker.getElement().querySelector('div').style.fontSize = s + 'px'; });
});// 6. 从本地 GeoJSON 文件加载全分辨率边界数据

var compassControl = L.Control.extend({
  options: { position: 'topright' },
  onAdd: function() {
    var div = L.DomUtil.create('div', 'leaflet-control');
    div.innerHTML = '<div style="width:40px;height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:14px;line-height:1.1;">'
      + '<span style="color:#5A3E28;font-size:16px;font-weight:bold;line-height:1;">&#9650;</span>'
      + '<span style="color:#5A3E28;margin-top:-2px;font-size:10px;">N</span>'
      + '</div>';
    L.DomEvent.disableClickPropagation(div);
    return div;
  }
});
map.addControl(new compassControl());

var resetCtrl = L.control({ position: 'topright' });
resetCtrl.onAdd = function() {
  var div = L.DomUtil.create('div', 'leaflet-control');
  div.innerHTML = '<div style="background:rgba(255,255,255,0.9);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:12px;color:#5A3E28;box-shadow:0 1px 6px rgba(0,0,0,0.1);border:1px solid #E8DDD0;white-space:nowrap;">↺ 全省视图</div>';
  div.onclick = function() { map.fitBounds(bounds, { maxZoom: 5.5 }); };
  L.DomEvent.disableClickPropagation(div);
  return div;
};
resetCtrl.addTo(map);

map.fitBounds(bounds);
